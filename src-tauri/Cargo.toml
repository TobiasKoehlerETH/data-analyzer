[package]
name = "data-analyzer"
version = "1.0.0"
description = "Desktop data analyzer for industrial time-series CSV files"
authors = ["Tobias Köhler"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "data_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
nalgebra = "0.33"
meval = "0.2"
rustfft = "6.2"
realfft = "3.4"
num-complex = "0.4"
chrono = "0.4"
encoding_rs = "0.8"
chardetng = "0.1"
csv = "1.3"
base64 = "0.22"
anyhow = "1"
libm = "0.2"
calamine = { version = "0.36", features = ["chrono"] }

[dev-dependencies]
rust_xlsxwriter = { version = "0.100", features = ["chrono"] }
rand = "0.8"
rand_distr = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
